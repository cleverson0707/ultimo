<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeHub | Dashboard de Produtividade</title>
    <!-- Google Fonts & FontAwesome para Ícones -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        /* --- VARIÁVEIS E TEMAS --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* --- RESET E ESTILOS GERAIS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 2fr;
            }
            .full-width {
                grid-column: span 2;
            }
        }

        /* --- COMPONENTES GLASSMORPHISM --- */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* --- HEADER / RELÓGIO --- */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .welcome h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .welcome p {
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .clock-display {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        /* --- FORMULÁRIOS E INPUTS --- */
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            padding: 0.75rem 1.2rem;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        /* --- LISTA DE TAREFAS (TO-DO) --- */
        .todo-list {
            list-style: none;
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
            padding: 1rem;
            border-radius: 14px;
            border: 1px solid transparent;
            animation: fadeIn 0.3s ease;
        }

        .todo-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
            background: rgba(16, 185, 129, 0.05);
        }

        .todo-text {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            user-select: none;
        }

        .delete-btn {
            background: transparent;
            color: var(--text-muted);
            padding: 0.5rem;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* --- BLOCO DE NOTAS --- */
        textarea {
            width: 100%;
            height: 250px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 1.2rem;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            outline: none;
            line-height: 1.6;
            margin-top: 1rem;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .status-saved {
            font-size: 0.85rem;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.5rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* --- FOCO / POMODORO TIMER --- */
        .pomodoro-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
        }

        .timer-display {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin: 1rem 0;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            gap: 1rem;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        h2 i {
            color: var(--accent);
        }

        /* Scrollbar Customizado */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- HEADER COMPLETO -->
        <div class="glass-panel header-panel full-width">
            <div class="welcome">
                <h1 id="greeting">Olá, Carregando...</h1>
                <p id="current-date">Sua central de foco e organização pessoal.</p>
            </div>
            <div class="clock-display" id="clock">00:00:00</div>
        </div>

        <!-- COLUNA DA ESQUERDA: TIMER POMODORO -->
        <div class="glass-panel">
            <div class="pomodoro-container">
                <h2><i class="fa-solid fa-hourglass-half"></i> Timer de Foco</h2>
                <div class="timer-display" id="timer">25:00</div>
                <div class="timer-controls">
                    <button id="start-timer-btn"><i class="fa-solid fa-play"></i> Iniciar</button>
                    <button id="reset-timer-btn" class="btn-secondary"><i class="fa-solid fa-rotate-left"></i> Reset</button>
                </div>
            </div>
        </div>

        <!-- COLUNA DA DIREITA: TAREFAS -->
        <div class="glass-panel">
            <h2><i class="fa-solid fa-list-check"></i> Minhas Tarefas</h2>
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="Adicionar uma nova tarefa...">
                <button id="add-todo-btn"><i class="fa-solid fa-plus"></i></button>
            </div>
            <ul class="todo-list" id="todo-list">
                <!-- Inserido dinamicamente via JS -->
            </ul>
        </div>

        <!-- LINHA DE BAIXO: NOTAS RÁPIDAS -->
        <div class="glass-panel full-width">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2><i class="fa-solid fa-pen-to-square"></i> Notas Rápidas (Salva automaticamente)</h2>
                <div class="status-saved" id="save-status"><i class="fa-solid fa-circle-check"></i> Alterações salvas</div>
            </div>
            <textarea id="notes-area" placeholder="Digite seus insights, lembretes ou rascunhos aqui..."></textarea>
        </div>

    </div>
